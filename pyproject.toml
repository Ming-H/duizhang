# 项目以 `python -m tally.cli` 从仓库根运行，不做库发布；
# [project] 只作元数据声明（版本锚点 / Python 版本门槛），依赖安装
# 走 requirements.txt（宽松声明）或 requirements.lock.txt（精确复现）。

[project]
name = "tally"
version = "0.7.0"
description = "中文财报封闭世界事实 Agent：LLM 组织语言，确定性闸门拥有事实"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E4/E7/E9 = pycodestyle 硬错误，F = pyflakes，I = import 排序
select = ["E4", "E7", "E9", "F", "I"]
