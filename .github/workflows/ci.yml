name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # 正常全程几分钟；卡死止损（默认上限 6 小时）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint（ruff）
        run: ruff check .

      - name: 单元测试（含 Store 幽灵块/多根摄取/对账闸门回归）
        run: python -m pytest -q

      - name: 冒烟：README 30 秒流程（samples 摄取 → 问答 → 评估）
        run: |
          python -m tally.cli ingest samples/
          python -m tally.cli ask "欧科亿 2026 年半年度预计净利润多少"
          python -m tally.cli eval --min-retrieval 1.0 --min-hit 1.0

      # 真值三集冒烟：随 git 入库的双语料（中际旭创 26MB + 贵州茅台
      # 10MB）+ samples 同库——47 题真值（innolight 31 事实/趋势/陷阱/
      # 鲁棒 + quarters 8 单季差分 + multihop 8 跨年/三公司）每次 push
      # 都跑，每题都是人工核对过的原文数字。
      - name: 冒烟：真值三集（innolight 31 + quarters 8 + multihop 8）
        env:
          TALLY_DB: /tmp/truth.db
        run: |
          python -m tally.cli ingest samples/
          python -m tally.cli ingest data/中际旭创
          python -m tally.cli ingest data/贵州茅台
          # --min-* 门槛低于即非零退出：CI 从「只防崩溃」升级为「防指标
          # 退化」（修前 eval 恒 exit 0，命中率跌穿 CI 依然全绿）
          python -m tally.cli eval --mode heuristic --dataset innolight --min-retrieval 1.0 --min-hit 1.0 --min-refusal 1.0
          python -m tally.cli eval --mode heuristic --dataset quarters --min-retrieval 1.0 --min-hit 1.0
          python -m tally.cli eval --mode heuristic --dataset multihop --min-retrieval 1.0 --min-hit 1.0
