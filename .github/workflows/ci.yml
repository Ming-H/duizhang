name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint（ruff）
        run: ruff check .

      - name: 单元测试（含 Store 幽灵块/多根摄取/对账闸门回归）
        run: python -m pytest -q

      - name: 冒烟：README 30 秒流程（samples 摄取 → 问答 → 评估）
        run: |
          python -m duizhang.cli ingest samples/
          python -m duizhang.cli ask "欧科亿 2026 年半年度预计净利润多少"
          python -m duizhang.cli eval

      # innolight 真值冒烟：随 git 入库的 26MB 中际旭创语料（10 docs /
      # 7,873 chunks）从死重变承重墙——19 题真值（事实/趋势/陷阱/鲁棒）
      # 每道都是人工核对过的原文数字。干净库全流程本地实测 ~2:40。
      - name: 冒烟：innolight 真值集（data/中际旭创 19 题）
        env:
          DZ_DB: /tmp/innolight.db
        run: |
          python -m duizhang.cli ingest data/中际旭创
          python -m duizhang.cli eval --dataset innolight
